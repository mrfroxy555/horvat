<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horvátország 2026 - Tervező</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK Setup -->
    <script type="importmap">
        {
          "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js"
          }
        }
    </script>
</head>

<body>

    <div id="app">
        <header>
            <h1>🇭🇷 Horvátország 2026</h1>
            <p class="subtitle">Segíts kiválasztani a legjobb időpontot a közös kiránduláshoz!</p>
        </header>

        <!-- Név megadása -->
        <section id="login-section">
            <div class="input-group">
                <input type="text" id="username" placeholder="Írd be a neved..." autocomplete="off">
            </div>
            <button class="btn" id="start-btn">Tovább a szavazáshoz</button>
        </section>

        <!-- Szavazó felület -->
        <section id="voting-section">
            <div id="name-display" style="margin-bottom: 1.5rem; font-weight: 600; color: var(--primary);"></div>
            <div class="week-grid" id="week-grid">
                <!-- Itt generálja a JS a heteket -->
            </div>
            <div style="text-align: center; margin-top: 2.5rem;">
                <button class="btn" id="submit-votes">Szavazatok beküldése</button>
            </div>
        </section>

        <!-- Eredmények (Csak szavazás után látható) -->
        <section id="results-section">
            <div class="results-header">
                <h2>📊 Ki mikor ér rá?</h2>
                <div id="best-date-card" class="best-date-card hidden">
                    <!-- Itt jelenik meg a legjobb időpont -->
                </div>
            </div>

            <div class="table-responsive">
                <table class="matrix-table" id="matrix-table">
                    <thead>
                        <tr id="matrix-header">
                            <th>Időpont</th>
                            <!-- Ide jönnek a nevek dinamikusan -->
                        </tr>
                    </thead>
                    <tbody id="matrix-body">
                        <!-- Ide jönnek a hetek és a szavazatok -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
